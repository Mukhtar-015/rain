version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.15.0

    working_directory: ~/public

    steps:
      - checkout

      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}

      - run:
          name: Install dependencies
          command: npm ci --include=dev

      - run:
          name: Check Jest installation
          command: |
            echo "NODE_ENV=$NODE_ENV"
            npm config get omit
            npm ls jest
            ls -la node_modules/.bin/jest

      - run:
          name: Run tests
          command: npm test

      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules

      - store_artifacts:
          path: test-results.xml
          prefix: tests

      - store_artifacts:
          path: coverage
          prefix: coverage

      - store_test_results:
          path: test-results.xml

  deploy:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Build Docker image
          command: |
            docker build -t mukhtar019/maths:latest .
      - run:
          name: Push Docker image to Docker Hub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker push mukhtar019/maths:latest

workflows:
  version: 2

  build_and_deploy:
    jobs:
      - build

      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main